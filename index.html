<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogoDig — All the favicons, none of the hunt.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inconsolata:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-left">
      <span class="logo">LogoDig</span>
      <span class="tagline">All the logos, none of the hunt.</span>
    </div>
    <div class="header-right">
      <div class="theme-toggle">
        <button class="toggle-btn" id="lightBtn" aria-label="Light mode">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <button class="toggle-btn" id="darkBtn" aria-label="Dark mode">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="search-wrap">
      <div class="search-box" id="searchBox">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" autocomplete="off" spellcheck="false" placeholder="Tool name or url...">
        <button class="search-clear-btn" id="searchClearBtn" aria-label="Clear search">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="1" y1="1" x2="10" y2="10"/>
            <line x1="10" y1="1" x2="1" y2="10"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="logo-grid" id="logoGrid"></div>
    <div class="empty-state hidden" id="emptyState">
      <pre id="asciiAnim" class="ascii-anim"></pre>
      <p class="empty-label">No favicons found for "<span id="searchQuery"></span>"</p>
    </div>
  </main>

  <footer class="footer">
    <span>Vibecoded by <a href="https://x.com/_afeeee" target="_blank" rel="noopener">@_afeeee</a>.</span>
    
  </footer>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
